# Gamma login (OAuth 2.0 authorization code flow). Endpoint paths follow Gamma's
# documented defaults and are overridable; client id and secret come from the environment.
gamma.base-url=${GAMMA_BASE_URL:https://auth.chalmers.it}
web.base-url=${WEB_BASE_URL:http://localhost:5173}
spring.security.oauth2.client.registration.gamma.provider=gamma
spring.security.oauth2.client.registration.gamma.client-id=${GAMMA_CLIENT_ID:unset}
spring.security.oauth2.client.registration.gamma.client-secret=${GAMMA_CLIENT_SECRET:unset}
spring.security.oauth2.client.registration.gamma.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.gamma.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.gamma.scope=openid,profile
spring.security.oauth2.client.provider.gamma.authorization-uri=${gamma.base-url}/api/oauth2/authorize
spring.security.oauth2.client.provider.gamma.token-uri=${gamma.base-url}/api/oauth2/token
spring.security.oauth2.client.provider.gamma.user-info-uri=${gamma.base-url}/api/oauth2/userinfo
spring.security.oauth2.client.provider.gamma.user-name-attribute=sub
